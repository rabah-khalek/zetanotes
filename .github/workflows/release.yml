name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string
      release_notes:
        description: 'Release notes (Markdown supported)'
        required: false
        type: string
        default: |
          ## What's New
          - Bug fixes and performance improvements

env:
  APP_NAME: ZetaNotes
  PUBLIC_REPO: rabah-khalek/zetanotes-dev

jobs:
  build-and-release:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Update Info.plist
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          INFO_PLIST="ZetaNotes/Info.plist"

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$INFO_PLIST"
          BUILD_NUMBER=$(date +%Y%m%d%H%M%S)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$INFO_PLIST"

          echo "✅ Updated Info.plist to version $VERSION (build $BUILD_NUMBER)"

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install dependencies
        run: |
          echo "/usr/local/bin:/opt/homebrew/bin" >> $GITHUB_PATH
          if ! command -v create-dmg &> /dev/null; then
            brew install create-dmg
          fi

      - name: Setup signing certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain

          security find-identity -v -p codesigning
          rm -f certificate.p12

      - name: Build, sign, and notarize release
        id: build
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          chmod +x scripts/release-new.sh
          ./scripts/release-new.sh ${{ steps.version.outputs.VERSION }}

          # Outputs are already set by release-new.sh via GITHUB_OUTPUT
          echo "✅ Release build complete"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          repository: ${{ env.PUBLIC_REPO }}
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: ZetaNotes v${{ steps.version.outputs.VERSION }}
          body: |
            ${{ github.event.inputs.release_notes || '## What''s New\n\n- Bug fixes and performance improvements' }}

            ---

            **Download the DMG, open it, and drag to Applications.**

            ### Privacy & Security
            - ✅ 100% offline AI processing
            - ✅ No cloud sync or data upload
            - ✅ No analytics or telemetry
            - ✅ No account required

            ### System Requirements
            - macOS 13.0 (Ventura) or later
            - Apple Silicon (M1/M2/M3/M4) recommended, Intel supported
            - 4 GB RAM minimum, 8 GB+ recommended

            ### Verification
            **SHA256:** `${{ steps.build.outputs.CHECKSUM }}`
          files: |
            ${{ steps.build.outputs.DMG_FILE }}
            ${{ steps.build.outputs.SHA_FILE }}
          draft: false
          prerelease: false

      - name: Update appcast.xml
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:$PUBLIC_REPO_TOKEN@github.com/${{ env.PUBLIC_REPO }}.git /tmp/public-repo
          cd /tmp/public-repo

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          RELEASE_NOTES='${{ github.event.inputs.release_notes || 'Bug fixes and performance improvements' }}'

          cat > appcast.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
              <channel>
                  <title>ZetaNotes Updates</title>
                  <link>https://www.zetanotes.com/appcast.xml</link>
                  <description>Most recent updates for ZetaNotes</description>
                  <language>en</language>

                  <item>
                      <title>Version ${{ steps.version.outputs.VERSION }}</title>
                      <link>https://github.com/${{ env.PUBLIC_REPO }}</link>
                      <sparkle:version>${{ steps.version.outputs.VERSION }}</sparkle:version>
                      <sparkle:shortVersionString>${{ steps.version.outputs.VERSION }}</sparkle:shortVersionString>
                      <description><![CDATA[
                          <h2>ZetaNotes ${{ steps.version.outputs.VERSION }}</h2>
                          <p>${RELEASE_NOTES}</p>
                      ]]></description>
                      <pubDate>$(date -R)</pubDate>
                      <enclosure
                          url="https://github.com/${{ env.PUBLIC_REPO }}/releases/download/v${{ steps.version.outputs.VERSION }}/${{ steps.build.outputs.DMG_NAME }}"
                          sparkle:version="${{ steps.version.outputs.VERSION }}"
                          sparkle:shortVersionString="${{ steps.version.outputs.VERSION }}"
                          length="${{ steps.build.outputs.FILE_SIZE }}"
                          type="application/octet-stream"
                          sparkle:edSignature="${{ steps.build.outputs.SPARKLE_SIGNATURE }}" />
                      <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
                  </item>
              </channel>
          </rss>
          EOF

          git add appcast.xml
          git commit -m "Update appcast.xml for v${{ steps.version.outputs.VERSION }}" || echo "No changes"
          git push

      - name: Update website
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          cd /tmp/public-repo

          VERSION="${{ steps.version.outputs.VERSION }}"
          DMG_NAME="${{ steps.build.outputs.DMG_NAME }}"

          sed -i "s|releases/latest/download/ZetaNotes-v[0-9.]*\.dmg|releases/latest/download/$DMG_NAME|g" docs/index.html
          sed -i "s|data-umami-event-version=\"[0-9.]*\"|data-umami-event-version=\"$VERSION\"|g" docs/index.html

          if ! git diff --quiet docs/index.html; then
            git add docs/index.html
            git commit -m "Update download link to v$VERSION"
            git push
            echo "✅ Website updated"
          fi

      - name: Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## ✅ Release Complete!

          **Version:** ${{ steps.version.outputs.VERSION }}
          **DMG:** ${{ steps.build.outputs.DMG_NAME }}
          **Size:** ${{ steps.build.outputs.FILE_SIZE }} bytes
          **SHA256:** \`${{ steps.build.outputs.CHECKSUM }}\`

          ### Links
          - [GitHub Release](https://github.com/${{ env.PUBLIC_REPO }}/releases/tag/v${{ steps.version.outputs.VERSION }})
          - [Download Page](https://www.zetanotes.com/)
          - [Appcast](https://www.zetanotes.com/appcast.xml)
          EOF
