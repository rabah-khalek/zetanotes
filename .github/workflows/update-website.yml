name: Update Website

on:
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update website (overwrites existing appcast.xml)'
        required: false
        type: boolean
        default: false

env:
  PUBLIC_REPO: rabah-khalek/zetanotes

jobs:
  update-website:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone public repo and update docs
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          # Clone public repo
          git clone https://x-access-token:$PUBLIC_REPO_TOKEN@github.com/${{ env.PUBLIC_REPO }}.git /tmp/public-repo
          cd /tmp/public-repo

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create docs folder if it doesn't exist
          mkdir -p docs

          # Copy docs from dev repo (excluding appcast.xml to preserve releases)
          cp ${{ github.workspace }}/docs/index.html ./docs/index.html
          cp ${{ github.workspace }}/docs/download.html ./docs/download.html
          cp ${{ github.workspace }}/docs/pricing.html ./docs/pricing.html
          cp ${{ github.workspace }}/docs/terms.html ./docs/terms.html
          cp ${{ github.workspace }}/docs/privacy.html ./docs/privacy.html
          cp ${{ github.workspace }}/docs/refunds.html ./docs/refunds.html
          cp ${{ github.workspace }}/docs/logo.png ./docs/logo.png

          # Copy appcast.xml if it doesn't exist or if this is a manual force update
          if [ ! -f ./docs/appcast.xml ] || [ "${{ github.event.inputs.force_update }}" = "true" ]; then
            cp ${{ github.workspace }}/docs/appcast.xml ./docs/appcast.xml
          fi

          # Check if there are any changes (including untracked files)
          echo "Checking for changes..."
          git status --porcelain docs/
          
          git add docs/
          if git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard docs/)" ]; then
            echo "No changes to commit"
          else
            echo "Changes detected, committing..."
            git status --short
            git commit -m "Website update"
            git push
            echo "Website updated successfully"
          fi

      - name: Summary
        run: |
          echo "## ✅ Website Update Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger**: Manual workflow dispatch" >> $GITHUB_STEP_SUMMARY
          echo "**Repository**: ${{ env.PUBLIC_REPO }}" >> $GITHUB_STEP_SUMMARY
          echo "**Force Update**: ${{ github.event.inputs.force_update || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📝 Files Updated:" >> $GITHUB_STEP_SUMMARY
          echo "- index.html (main website)" >> $GITHUB_STEP_SUMMARY
          echo "- download.html (download page)" >> $GITHUB_STEP_SUMMARY
          echo "- pricing.html (pricing redirect)" >> $GITHUB_STEP_SUMMARY
          echo "- terms.html (terms of service)" >> $GITHUB_STEP_SUMMARY
          echo "- privacy.html (privacy policy)" >> $GITHUB_STEP_SUMMARY
          echo "- refunds.html (refund policy)" >> $GITHUB_STEP_SUMMARY
          echo "- logo.png (app logo)" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event.inputs.force_update }}" = "true" ]; then
            echo "- appcast.xml (forced update)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- appcast.xml (only if missing)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Live Site:" >> $GITHUB_STEP_SUMMARY
          echo "- **Website**: https://rabah-khalek.github.io/zetanotes/" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Pages** will auto-deploy in 1-2 minutes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note**: This workflow now runs manually only. Use 'Run workflow' button in GitHub Actions." >> $GITHUB_STEP_SUMMARY
